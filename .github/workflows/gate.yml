# Server-side mirror of the pre-commit gate. Husky's `--no-verify` is bypassable
# (research-auto-foldering.md §2), so every load-bearing gate runs here too — structure governance
# included. A push that skipped the local hook still fails on the server.
name: gate

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request supersedes that PR's older run. Every other run gets a group of
# its own, so each push to main keeps a completed run and the commit that broke it stays findable.
concurrency:
  group: gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # main's single required check: fails unless every job in needs succeeded, since GitHub passes a
  # skipped required job.
  required:
    needs: [gate, tests, test-report]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<<"$RESULTS" >/dev/null

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        id: install
        run: bun install --frozen-lockfile

      # Each check runs once Install succeeds, so an early red never hides Typecheck or Tests.
      - name: Format (Oxfmt)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run format:check

      - name: Lint (Oxlint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint

      - name: Anti-slop (Oxlint, baseline-aware)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          ANTI_SLOP_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ANTI_SLOP_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$ANTI_SLOP_BASE" || "$ANTI_SLOP_BASE" =~ ^0+$ ]]; then
            ANTI_SLOP_BASE="$(git mktree </dev/null)"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            ANTI_SLOP_BASE="$(git merge-base "$ANTI_SLOP_BASE" "$ANTI_SLOP_HEAD")"
          fi
          node cli/index.mts anti-slop check --base "$ANTI_SLOP_BASE"

      - name: Structure governance (folder-structure)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint:structure

      - name: Ratchet — folder fan-out
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node gate-engine/ratchets/folder-fanout.mts gate

      - name: Ratchet — size-disable
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          GUARD_RATCHET_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: node gate-engine/ratchets/size-disable.mts gate

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck

      - name: Benchmark tracker typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run benchmarks:typecheck

      - name: Benchmark evidence (committed tree + append-only base)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          BENCHMARK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run benchmarks:check -- --mode tree --tree HEAD --base "$BENCHMARK_BASE"

      # Regenerated dist is release-only (typescript-source-prebuilt-mjs, sc-2467). Judged on the PR's
      # committed tree because every path a commit takes to a PR passes here, whichever tool made it.
      - name: Release-only dist (a PR may add or delete dist, never rewrite it)
        if: github.event_name == 'pull_request' && !cancelled() && steps.install.outcome == 'success'
        env:
          DIST_BASE: ${{ github.event.pull_request.base.sha }}
          DIST_HEAD: ${{ github.event.pull_request.head.sha }}
          DIST_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node cli/lib/ship/dist-integrity.mts --root . --tree "$(git rev-parse "$DIST_HEAD^{tree}")" \
            --base "$(git merge-base "$DIST_BASE" "$DIST_HEAD")" --branch "$DIST_BRANCH" --

  # The suite is worker-bound (file time ≈ 3 workers x wall), so it splits across runners. No `name`:
  # gh pr checks keeps one check per name, so same-named shards would let ship --wait-ci pass early.
  tests:
    runs-on: ubuntu-latest
    strategy:
      # A cancelled sibling would take its blob, and so its files' per-file record, with it.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # `devkit machine` records flows in Playwright's headless shell; its capture tests need it here.
      - name: Install headless browser
        run: node_modules/.bin/playwright-core install --with-deps chromium-headless-shell

      # STEP-level, deliberately, not job-level (sc-2393). A job timeout cancels the job, which puts
      # the `if: always()` uploads below at the mercy of cancellation semantics; a step bound leaves
      # the job alive so a wedged shard still publishes its tombstone. Vitest has no run-level
      # deadline of its own, so an external bound is the only place this can live. Sized as a HANG
      # detector and nothing else: the unsharded step ran 24m40s-31m56s before sc-2393 and ~40 min
      # by October, so 90 per shard is far over any healthy shard. Never lower it to make a slow
      # run fail faster.
      - name: Tests
        timeout-minutes: 90
        # The runner is dedicated, unlike a dev box: 3 workers on its 4 vCPUs instead of '50%' = 2.
        env:
          VITEST_MAX_WORKERS: 3
          SHARD: ${{ matrix.shard }}
        run: bun run test:run --shard="$SHARD/4" --reporter=blob --reporter=default

      # download-artifact takes the newest artifact per name across run attempts, so a shard that
      # wrote no blob must still upload something, or a re-run would merge an older attempt's blob.
      - name: Mark a shard that wrote no blob
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p .vitest/blob
          [[ -f ".vitest/blob/blob-$SHARD-4.json" ]] || touch ".vitest/blob/missing-$SHARD"

      - name: Upload shard blob
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error

  # One merged report from every shard's blob, so `devkit baseline-status` still reads one summary.
  test-report:
    needs: [tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Download shard blobs
        uses: actions/download-artifact@v8
        with:
          pattern: test-blob-*
          merge-multiple: true
          path: .vitest/blob

      # vitest merges whatever blobs exist, so a missing shard would publish a partial green.
      - name: Every shard wrote a blob
        run: |
          missing=""
          for i in 1 2 3 4; do
            [[ -f ".vitest/blob/blob-$i-4.json" && ! -e ".vitest/blob/missing-$i" ]] || missing+=" $i"
          done
          if [[ -n "$missing" ]]; then
            echo "::error::no test result from shard(s)$missing; refusing to publish a partial report"
            exit 1
          fi

      # A hang bound only: the merge replays reporters and runs no tests, so a healthy one takes minutes.
      - name: Merge shard reports
        timeout-minutes: 30
        run: bun run test:run:report --mergeReports

      # Uploaded on RED runs too — a red run is precisely the one `devkit baseline-status` exists to
      # decompose into per-file facts. Two artifacts, not one: a baseline query fetches only the
      # small summary, so bundling it with the multi-MB report would make every walk-back expensive.
      # The producer writes into a per-run directory and never a shared path, so nothing uploaded
      # here can be an artifact some other run produced.
      - name: Upload test report summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-summary
          path: .devkit/test-reports/*/summary.json
          # `.devkit` is a dot-folder, and upload-artifact excludes "files within folders beginning
          # with `.`" by default — without this the artifact uploads NOTHING, and
          # `if-no-files-found: ignore` makes that silent, so every baseline query answers
          # "no artifact" forever.
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload full test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: .devkit/test-reports/*/report.json
          include-hidden-files: true
          if-no-files-found: ignore
