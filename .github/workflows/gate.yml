# Server-side mirror of the pre-commit gate. Husky's `--no-verify` is bypassable
# (research-auto-foldering.md §2), so every load-bearing gate runs here too — structure governance
# included. A push that skipped the local hook still fails on the server.
name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format (Oxfmt)
        run: bun run format:check

      - name: Lint (Oxlint)
        run: bun run lint

      - name: Anti-slop (Oxlint, baseline-aware)
        env:
          ANTI_SLOP_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ANTI_SLOP_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$ANTI_SLOP_BASE" || "$ANTI_SLOP_BASE" =~ ^0+$ ]]; then
            ANTI_SLOP_BASE="$(git mktree </dev/null)"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            ANTI_SLOP_BASE="$(git merge-base "$ANTI_SLOP_BASE" "$ANTI_SLOP_HEAD")"
          fi
          node cli/index.mts anti-slop check --base "$ANTI_SLOP_BASE"

      - name: Structure governance (folder-structure)
        run: bun run lint:structure

      - name: Ratchet — folder fan-out
        run: node gate-engine/ratchets/folder-fanout.mts gate

      - name: Ratchet — size-disable
        env:
          GUARD_RATCHET_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: node gate-engine/ratchets/size-disable.mts gate

      - name: Typecheck
        run: bun run typecheck

      - name: Benchmark tracker typecheck
        run: bun run benchmarks:typecheck

      - name: Benchmark evidence (committed tree + append-only base)
        env:
          BENCHMARK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run benchmarks:check -- --mode tree --tree HEAD --base "$BENCHMARK_BASE"

      # STEP-level, deliberately, not job-level (sc-2393). A job timeout cancels the job, which puts
      # the two `if: always()` uploads below at the mercy of cancellation semantics; a step bound
      # leaves the job alive so a wedged run still publishes whatever per-file record exists and
      # `devkit baseline-status` keeps answering. Vitest has no run-level deadline of its own and no
      # open request for one, so an external bound is the only place this can live; without it the
      # job inherited GitHub's 6-hour default. Sized as a HANG detector and nothing else, from the
      # measured spread rather than a guess: this step ran 24m40s-31m56s across the six runs before
      # sc-2393 (33835847680, 33835531417, 33833431176, 33824241686, 33808990242, 33775305022), so
      # 90 leaves ~2.8x over the observed max. A bound that a healthy run can reach IS the flake it
      # was meant to catch — raise it if a legitimate run ever approaches it, and never lower it to
      # make a slow run fail faster.
      - name: Tests
        timeout-minutes: 90
        run: bun run test:run:report

      # Uploaded on RED runs too — a red run is precisely the one `devkit baseline-status` exists to
      # decompose into per-file facts. Two artifacts, not one: a baseline query fetches only the
      # small summary, so bundling it with the multi-MB report would make every walk-back expensive.
      # The producer writes into a per-run directory and never a shared path, so nothing uploaded
      # here can be an artifact some other run produced.
      - name: Upload test report summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-summary
          path: .devkit/test-reports/*/summary.json
          # `.devkit` is a dot-folder, and upload-artifact excludes "files within folders beginning
          # with `.`" by default — without this the artifact uploads NOTHING, and
          # `if-no-files-found: ignore` makes that silent, so every baseline query answers
          # "no artifact" forever.
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload full test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: .devkit/test-reports/*/report.json
          include-hidden-files: true
          if-no-files-found: ignore
